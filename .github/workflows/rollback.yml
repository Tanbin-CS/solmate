name: Rollback

# One-click rollback from the Actions tab. It only goes back to builds that a successful Deploy
# run shipped: "api" sends all Cloud Run traffic to the newest older revision whose GIT_SHA
# belongs to such a run (a failed candidate revision is never chosen); "web" re-releases the
# newest older Hosting version deployed by such a run ("ci <sha>" message). "both" does both.
# A smoke test then checks that the site and the API report the same results version, so a
# web-only or API-only rollback that splits the pair fails loudly. Nothing is deleted.

on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to roll back"
        type: choice
        options: [web, api, both]
        default: web

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: solmate-13571
  REGION: us-west1
  SERVICE: solmate-terrain
  HOSTING_SITE: solmate-analog
  WIF_PROVIDER: projects/314008475333/locations/global/workloadIdentityPools/github/providers/github-oidc
  DEPLOYER: solmate-deployer@solmate-13571.iam.gserviceaccount.com

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      actions: read # to list the successful Deploy runs
    env:
      GH_TOKEN: ${{ github.token }}
      SITE: https://solmate-analog.web.app
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Commits that a successful Deploy run shipped
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?status=success&per_page=100"             --jq '.workflow_runs[].head_sha[0:7]' | sort -u > "$RUNNER_TEMP/good.txt"
          echo "$(wc -l < "$RUNNER_TEMP/good.txt") successful deploys"
          test -s "$RUNNER_TEMP/good.txt"
      - name: API to the previous good revision
        if: inputs.what == 'api' || inputs.what == 'both'
        run: |
          set -euo pipefail
          current=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json             | jq -r '[.status.traffic[] | select(.percent == 100)][0].revisionName')
          # newest first: ready revisions older than the serving one, with the commit they were built from
          gcloud run revisions list --service "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json             | jq -r --arg cur "$current" '
                (map(select(.metadata.name == $cur))[0].metadata.creationTimestamp) as $t
                | map(select(.metadata.creationTimestamp < $t
                    and any(.status.conditions[]?; .type == "Ready" and .status == "True")))
                | sort_by(.metadata.creationTimestamp) | reverse[]
                | [.metadata.name, ((.spec.containers[0].env // []) | map(select(.name == "GIT_SHA"))[0].value // "")] | @tsv'             > "$RUNNER_TEMP/revisions.tsv"
          previous=$(awk -F'	' 'NR==FNR { good[$1]; next } ($2 in good) { print $1; exit }' "$RUNNER_TEMP/good.txt" "$RUNNER_TEMP/revisions.tsv")
          if [ -z "$previous" ]; then echo "::error::no older revision from a successful deploy"; exit 1; fi
          echo "API: $current -> $previous"
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$previous=100" --quiet
      - name: Web to the previous good Hosting release
        if: inputs.what == 'web' || inputs.what == 'both'
        run: |
          set -euo pipefail
          api="https://firebasehosting.googleapis.com/v1beta1/sites/$HOSTING_SITE"
          auth="Authorization: Bearer $(gcloud auth print-access-token)"
          curl -fsS -H "$auth" "$api/releases?pageSize=100" > "$RUNNER_TEMP/releases.json"
          current=$(jq -r '.releases[0].version.name' "$RUNNER_TEMP/releases.json")
          # deploys by CI, newest first, as "version<TAB>sha"; skip down to the live version, then take the next good one
          version=$(jq -r '.releases[] | select(.type == "DEPLOY" and ((.message // "") | test("^ci [0-9a-f]{7}$")))
                      | [.version.name, (.message | ltrimstr("ci "))] | @tsv' "$RUNNER_TEMP/releases.json"             | awk -F'	' -v cur="$current" 'NR==FNR { good[$1]; next } $1 == cur { past=1; next } past && ($2 in good) { print $1; exit }'                 "$RUNNER_TEMP/good.txt" -)
          if [ -z "$version" ]; then echo "::error::no older Hosting version from a successful deploy"; exit 1; fi
          echo "Hosting: $current -> $version"
          curl -fsS -X POST -H "$auth" "$api/releases?versionName=$version" -o /dev/null
      - name: Smoke test the rolled-back pair
        run: |
          set -euo pipefail
          sleep 20
          curl -fsS "$SITE/api/v1/health" | grep -q '"ok"'
          web=$(curl -fsS "$SITE/data/v2/model.json" | jq -r .model_version)
          api=$(curl -fsS "$SITE/api/v1/version" | jq -r .model_version)
          echo "results version: web $web, api $api"
          if [ "$web" != "$api" ]; then
            echo "::error::web and API now report different results versions; roll back 'both', or redeploy main"
            exit 1
          fi
