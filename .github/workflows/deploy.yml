name: Deploy

# Every merge to main ships SolMate: the terrain API to Cloud Run (only when its code or
# data changed; tested on a tagged revision before it takes traffic), then the web app,
# Firestore rules and the redirect site to Firebase Hosting, then a smoke test of production.
# Authentication is keyless: GitHub OIDC -> Workload Identity Federation -> solmate-deployer,
# which only runs from Tanbin-CS/solmate.

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy_api:
        description: "Also redeploy the Cloud Run API"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: solmate-13571
  REGION: us-west1
  SERVICE: solmate-terrain
  WIF_PROVIDER: projects/314008475333/locations/global/workloadIdentityPools/github/providers/github-oidc
  DEPLOYER: solmate-deployer@solmate-13571.iam.gserviceaccount.com
  SITE: https://solmate-analog.web.app
  OLD_SITE: https://solmate-13571.web.app
  FIREBASE_TOOLS: firebase-tools@14.26.0

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Compare with the commit the live API runs, not only the last commit: a rebase-merge
      # pushes several commits, and a skipped or failed deploy must be caught up next time.
      - id: diff
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_api }}
        run: |
          live=$(curl -fsS --max-time 30 "$SITE/api/v1/version" | jq -r '.git_sha // empty' || true)
          echo "live API commit: ${live:-unknown}"
          api_paths='^(api/|analysis/src/|analysis/pyproject.toml|analysis/uv.lock|Dockerfile|\.dockerignore|\.gcloudignore|data/screening/(stage2|release)|data/stack/astgtm|data/targets/)'
          known() { printf '%s' "$live" | grep -qE '^[0-9a-f]{7,40}$' && git cat-file -e "${live}^{commit}" 2>/dev/null; }
          changed() { git diff --name-only "$live" HEAD > "$RUNNER_TEMP/changed.txt" && grep -qE "$api_paths" "$RUNNER_TEMP/changed.txt"; }
          if [ "$FORCE" = "true" ] || ! known || changed; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build and deploy a tagged revision (no traffic yet)
        run: |
          gcloud run deploy "$SERVICE" --source . --project "$PROJECT_ID" --region "$REGION" \
            --no-traffic --tag candidate --update-env-vars "GIT_SHA=${GITHUB_SHA::7}" --quiet
      - name: Smoke test the tagged revision
        run: |
          set -euo pipefail
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')
          test -n "$url"
          curl -fsS "$url/api/v1/health" | grep -q '"ok"'
          curl -fsS "$url/api/v1/version" | grep -q "${GITHUB_SHA::7}"
          # App Check is enforced: a request without a token must be refused
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"target_id":"jezero_crater","lat":37.05,"lon":86.75}' "$url/api/v1/terrain")
          test "$code" = "401"
      - name: Send all traffic to the new revision
        run: gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-latest --quiet

  web:
    needs: [changes, api]
    if: ${{ always() && needs.changes.result == 'success' && (needs.api.result == 'success' || needs.api.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Restore the web tiles from their GCS mirror
        run: |
          # model.json names the tile set it was exported with; tiles of other sets never mix in
          model=frontend/public/data/v2/model.json
          tileset=$(jq -r '.tiles.tileset // empty' "$model")
          printf '%s' "$tileset" | grep -qE '^[0-9a-f]{12}$'
          mkdir -p frontend/public/data/v2/tiles
          gcloud storage rsync --recursive "gs://${PROJECT_ID}-data/web/tilesets/$tileset" frontend/public/data/v2/tiles
          n=$(ls frontend/public/data/v2/tiles | wc -l)
          want=$(jq '.tiles.available | length' "$model")
          echo "tileset $tileset: $n of $want tiles"
          test "$n" -eq "$want"
      - name: Build
        working-directory: frontend
        env:
          # public Firebase web key (referrer- and API-restricted); App Check needs it
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
        run: |
          test -n "$VITE_FIREBASE_API_KEY"
          npm ci
          npm run build
      - name: Deploy Hosting (both sites) and Firestore rules
        run: npx --yes "$FIREBASE_TOOLS" deploy --only hosting,firestore:rules --project "$PROJECT_ID" --non-interactive --message "ci ${GITHUB_SHA::7}"
      - name: Smoke test production
        run: |
          set -euo pipefail
          sleep 20
          for p in / /explorer /findings /method /provenance /learn /data/v2/model.json /data/v2/tiles/05_26.bin.gz /api/v1/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE$p"); echo "$p $code"; test "$code" = "200"
          done
          h=$(curl -sI "$SITE/explorer")
          echo "$h" | grep -qi '^content-security-policy:'
          echo "$h" | grep -qi '^strict-transport-security:'
          echo "$h" | grep -qi '^cache-control: no-cache'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$OLD_SITE/method")" = "301"
          # Only app routes (no file extension) fall back to the app shell: a missing data file is a 404,
          # so a broken release cannot pass as "200" with index.html in place of its data.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/data/v2/smoke-missing.json")" = "404"
          # Every data file the app loads parses as JSON, for every target.
          screens=$(curl -fsS "$SITE/data/v2/targets.json" | jq -r '.targets[].id | "screening/\(.).json"')
          for p in model.json targets.json validation.json report.json provenance.json terrain3d/index.json $screens; do
            curl -fsS "$SITE/data/v2/$p" | jq -e 'type == "object"' > /dev/null || { echo "::error::$p is not JSON"; exit 1; }
          done
          # Tiles are the gzip files model.json lists, not a page: check the gzip magic of the first and last.
          for t in $(curl -fsS "$SITE/data/v2/model.json" | jq -r '.tiles.available | first, last'); do
            curl -fsS -o "$RUNNER_TEMP/tile" "$SITE/data/v2/tiles/$t.bin.gz"
            magic=$(od -An -N2 -tx1 "$RUNNER_TEMP/tile" | tr -d ' \n')
            test "$magic" = "1f8b" || { echo "::error::tile $t is not gzip ($magic)"; exit 1; }
          done
          # The browser and the terrain API must report the same results version.
          web=$(curl -fsS "$SITE/data/v2/model.json" | jq -r .model_version)
          api=$(curl -fsS "$SITE/api/v1/version" | jq -r .model_version)
          echo "results version: web $web, api $api"; test "$web" = "$api"
