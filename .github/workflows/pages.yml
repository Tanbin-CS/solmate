name: Pages redirect

# The October prototype was published at tanbin-cs.github.io/solmate. SolMate now lives on
# Firebase Hosting; GitHub Pages only serves a page that forwards there, so old links still work.

on:
  push:
    branches: ["main"]
    paths: ["infra/hosting-redirect/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Redirect page for every path
        run: |
          mkdir -p site
          cp infra/hosting-redirect/index.html site/index.html
          cp infra/hosting-redirect/index.html site/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
