name: Task / user story
description: A planned piece of work
body:
  - type: textarea
    id: story
    attributes: {label: User story, description: "As a ... I want ... so that ..."}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance criteria, description: Given / When / Then}
    validations: {required: true}
  - type: dropdown
    id: priority
    attributes: {label: MoSCoW, options: [must, should, could, wont]}
    validations: {required: true}
