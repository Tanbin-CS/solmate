# Process-analog tags. A tag fires when every condition holds for a place; the tag
# links the Earth process to the planetary process it can teach about. Thresholds are
# stated in physical units so judges can check them.
version: 2
tags:
  aeolian_dust:
    name: Aeolian dust
    when: {dust_aod_mean: {gte: 0.15}, barren_pct: {gte: 80}}
    analog: Martian dust storms, dust lifting and deposition (Mars)
    bodies: [mars]
  evaporite_playa:
    name: Evaporite flat / playa
    when: {aridity_index: {lt: 0.05}, albedo_wsa_sw: {gte: 0.30}, slope_median_deg: {lt: 1.0}}
    analog: Water-driven alteration and salt deposits in ancient lake basins such as Jezero (Mars)
    bodies: [mars]
  volcanic_mafic:
    name: Mafic volcanic surface
    when: {mafic_index: {gte_earth_quantile: 95}, barren_pct: {gte: 50}}
    analog: Basaltic plains and lava flows of the lunar maria and Martian volcanic provinces
    bodies: [moon, mars]
  periglacial:
    name: Periglacial ground
    when: {t2m_mean_c: {lt: 0.0}, snow_months_per_year: {gte: 6}, barren_pct: {gte: 50}}
    analog: Ground ice, patterned ground and sublimation at mid-latitude Mars (Arcadia) and lunar cold traps
    bodies: [moon, mars]
  rugged_highland:
    name: Rugged highland relief
    when: {slope_median_deg: {gte: 8.0}, barren_pct: {gte: 50}}
    analog: Crater rims and massifs of the lunar south pole (Malapert, Cabeus B, de Gerlache)
    bodies: [moon]
uses:
  - id: rover_mobility
    text: Rover and EVA mobility trials on slopes and loose barren ground.
    when: {slope_median_deg: {gte: 3.0}, barren_pct: {gte: 60}}
  - id: landing_construction
    text: Landing-pad, regolith-handling and construction trials on flat barren ground.
    when: {slope_median_deg: {lt: 1.0}, barren_pct: {gte: 60}}
  - id: thermal_cycling
    text: Instrument and habitat thermal-cycling tests in large day-night temperature swings.
    when: {lst_diurnal_range_k: {gte_earth_quantile: 90}}
  - id: ice_isru
    text: Ice prospecting, drilling and ISRU rehearsals in frozen ground.
    when: {t2m_mean_c: {lt: 0.0}, frost_days_per_year: {gte: 200}}
  - id: dust_mitigation
    text: Dust-mitigation tests for seals, solar panels and suits.
    when: {dust_aod_mean: {gte: 0.15}}
  - id: astrobiology_extreme_dry
    text: Life-detection instrument tests at the dry limit of life (biosignature preservation).
    when: {aridity_index: {lt: 0.05}, barren_pct: {gte: 80}}
# Habitability and biology (shown, never scored). The context line is always shown for the
# body; a rule's line is shown when every condition holds for the place.
habitability:
  context:
    moon: >-
      The Moon has no air, no liquid water and no known life. On an Earth analog, biology
      matters as something to keep away from instruments, not as something to study.
    mars: >-
      Mars once had lakes and still holds ground ice, so it may have been habitable. Earth
      analogs help test how to recognise signs of past or present life in rock and soil.
  rules:
    - id: hyper_arid
      bodies: [mars]
      when: {aridity_index: {lt: 0.05}}
      text: >-
        Hyper-arid: soils this dry hold very little life, so life-detection instruments can be
        tested against a nearly lifeless background, as in the Atacama.
    - id: arid
      bodies: [mars]
      when: {aridity_index: {gte: 0.05, lt: 0.2}}
      text: >-
        Arid: soil life is sparse but present, a test of telling weak biological signals apart
        from mineral ones.
    - id: thin_air_uv
      bodies: [mars]
      when: {surface_pressure_hpa: {lt: 650}}
      text: >-
        High altitude: thinner air lets more ultraviolet light reach the ground, one of the
        stresses life would face at the Martian surface.
    - id: frozen_ground
      bodies: [mars]
      when: {t2m_mean_c: {lt: 0.0}, frost_days_per_year: {gte: 200}}
      text: >-
        Frozen most of the year: a place to study how life persists in cold ground, relevant
        to ice-rich Mars sites such as Arcadia Planitia.
    - id: bare_surface
      bodies: [moon, mars]
      when: {barren_pct: {gte: 90}}
      text: >-
        Over 90% bare ground: plants do not hide the surface, so sensors see rock and soil much
        as they would on the Moon or Mars.
