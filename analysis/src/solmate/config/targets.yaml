    t2m_coldest_month_c:
      value: -58
      unit: degC
      method: proxy
      source: Munguira et al. 2023, JGR Planets 128, e2022JE007559 (MEDA near-surface temperatures, table of diurnal stats)
      doi: 10.1029/2022JE007559
      uncertainty: +/-8 degC; MEDA coverage Ls 25-180 only
      excerpt: Coldest seasonal mean air temperature observed by MEDA was about 216 K (Ls 25); rounded to -58 degC pending
        full-year data.
  breaks_down:
    gravity_m_s2:
      value: 3.73
      unit: m/s^2
      method: literature
      source: NASA NSSDCA Mars Fact Sheet
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html
      uncertainty: 3.69 (equator) to 3.73 (mean)
      excerpt: NASA lists Mars mean surface gravity as 3.73 m/s^2 (0.38 g) and 3.69 at the equator.
    surface_pressure_hpa:
      value: 7.0
      unit: hPa
      method: literature
      source: Sanchez-Lavega et al. 2023, JGR Planets 128, e2022JE007480 (MEDA pressure, sols 15-460)
      doi: 10.1029/2022JE007480
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10078360/
      uncertainty: 6.25-7.61 hPa daily means over sols 15-460
      excerpt: MEDA daily-mean pressure rose from 735 Pa (Ls 13-16) to 761 Pa (Ls 55), then fell to ~625 Pa at the seasonal
        minimum, so ~7 hPa is typical.
    radiation_dose_msv_day:
      value: 0.64
      unit: mSv/day
