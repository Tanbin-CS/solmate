- id: arcadia_planitia
  name: Arcadia Planitia (site AP-1)
  body: mars
  group: swim_human_base_ice_target
  centroid:
    lat: 39.8
    lon: 202.1
    lon_west: 157.9
    frame: planetocentric, east-positive (0-360)
    approximate: true
    method: Representative site AP-1 from the downselected Starship/human landing sites (Golombek et al. 2021, Table 1); elevation
      -3.9 km (MOLA geoid)
    source: Golombek et al. 2021, LPSC 52 abstract 2420 (SpaceX Starship landing sites on Mars, Table 1)
    url: https://www.hou.usra.edu/meetings/lpsc2021/pdf/2420.pdf
    also: Luzzi et al. 2025, JGR Planets 130, e2024JE008724 (near-surface ice at AP-1/AP-8/AP-9) doi:10.1029/2024JE008724;
      Morgan et al. 2021, Nature Astronomy 5, 230-236 (SWIM ice consistency, northern mid-latitudes) doi:10.1038/s41550-020-01290-z
    excerpt: Of the 12 Arcadia sites, AP-1 on the sinuous (possibly glacial) unit is judged the safest, with a moderate combined
      SWIM ice score, and was one of four primary downselected sites. Luzzi et al. 2025 map polygons there suggesting ice
      ~8-12 cm deep. The site lies on the Arcadia/northern Amazonis boundary.
  indicators:
    lst_diurnal_range_k:
      value: 70
      unit: K
      method: proxy
      source: Bramson et al. 2017, JGR Planets 122, 2250-2266 (preservation of midlatitude ice sheets; TES albedo/TI for Arcadia);
        Martinez et al. 2023, JGR Planets 128, e2022JE007537 (MEDA surface energy budget, albedo, thermal inertia)
      doi: 10.1002/2017JE005357
      uncertainty: +/-25 K (40-95 K); not an observed value
      excerpt: Estimate only. Arcadia's TES thermal inertia (~196 SI) and albedo (0.23) from Bramson et al. are close to Jezero
        terrain where MEDA saw ~87 K swings (TI ~230, 18 N). Arcadia lies at ~40 N with a brighter surface, so its annual-typical
        range should be smaller, especially in winter.
    lst_night_min_k:
      value: 165
      unit: K
      method: proxy
      source: Bramson et al. 2017, JGR Planets 122, 2250-2266 (preservation of midlatitude ice sheets; TES albedo/TI for Arcadia)
      doi: 10.1002/2017JE005357
      uncertainty: +/-15 K; winter nights approach the CO2 frost point (~148 K)
      excerpt: Estimate only. Bramson et al.'s Arcadia thermal model pins surface temperature at the CO2 frost point (~148
        K) when frost forms; non-frosted nights at 40 N should be ~150-185 K. A Mars Climate Database or MARSTHERM run at
        the centroid can replace this.
    t2m_mean_c:
      value: -73
      unit: degC
      method: proxy
      source: Bramson et al. 2017, JGR Planets 122, 2250-2266 (preservation of midlatitude ice sheets; TES albedo/TI for Arcadia)
      doi: 10.1002/2017JE005357
      uncertainty: +/-8 degC
      excerpt: Bramson et al. use annual-average temperatures of ~195-215 K (excess-ice interface ~195-205 K) for Arcadia.
        Annual-mean surface/near-surface temperature is taken as ~200 K = -73 degC.
      value_k: 200
    rh2m_pct:
      value: 5
      unit: '%'
      method: proxy
      source: Placeholder borrowed from Jezero MEDA (Rodriguez-Manfredi et al. 2023, Nature Geoscience 16, 19 (MEDA, first
        250 sols; text read from Research Square preprint))
      doi: 10.1038/s41561-022-01084-0
      uncertainty: unknown; likely saturated with respect to ice on winter nights (Viking Lander 2 frost analog)
      excerpt: No published near-surface RH exists for Arcadia, so the Jezero diurnal-mean estimate is reused as a placeholder.
        Viking Lander 2 (48 N) saw winter water frost, so night RH(ice) reaches 100% in some seasons.
    albedo_wsa_sw:
      value: 0.23
      unit: unitless (TES bolometric Lambert albedo)
      method: literature
      source: Bramson et al. 2017, JGR Planets 122, 2250-2266 (preservation of midlatitude ice sheets; TES albedo/TI for Arcadia)
      doi: 10.1002/2017JE005357
      uncertainty: +/-0.03 (regional average)
      excerpt: Bramson et al. take an average TES albedo of 0.23 for Arcadia Planitia (vs 0.12 for Utopia), citing Christensen
        et al. 2001.
    mineral_class:
      mafic: true
      carbonate: false
      quartz_rich: false
      dominant: dust-mantled northern-plains volcanic/sedimentary plains; TES lowland 'Surface Type 2' (plagioclase + volcanic
        glass, andesitic or weathered basalt)
      method: literature
      source: Bandfield, Hamilton & Christensen 2000, Science 287, 1626-1630 (MGS-TES global surface compositions)
      doi: 10.1126/science.287.5458.1626
      uncertainty: Arcadia is relatively bright and dusty, so TES spectral unmixing there is weak; 'basaltic plains' is a
        class-level call
      excerpt: 'TES finds two low-albedo surface types: plagioclase+clinopyroxene basalt on older terrain and a more silicic
        plagioclase+glass composition concentrated in the younger northern plains. Neither is carbonate- or quartz-rich.'
    snow_months_per_year:
      value: 2
      unit: months
      method: proxy
      source: Chevrier 2025, Communications Earth & Environment 6, 447 (frost at the Viking Lander 2 site; reviews Svitek
        & Murray 1990); Morgan et al. 2021, Nature Astronomy 5, 230-236 (SWIM ice consistency, northern mid-latitudes)
      doi: 10.1038/s43247-025-02411-0
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12151863/
      uncertainty: 0-3 for surface frost; 12 if buried ground ice is counted
      excerpt: Viking Lander 2 (48 N) saw H2O frost from about Ls 240 until it vanished at Ls ~330-360, about a quarter of
        the Mars year (~3 Earth-month equivalents). AP-1 is ~8 deg further south, so 2 is proposed. SWIM (Morgan et al. 2021)
        maps excess ground ice within ~1 m year-round, which matters for an ice base but is not surface snow cover.
      alt_value_if_ground_ice: 12
    frost_days_per_year:
      value: 365
      unit: days
      method: proxy
      source: Bramson et al. 2017, JGR Planets 122, 2250-2266 (preservation of midlatitude ice sheets; TES albedo/TI for Arcadia)
      doi: 10.1002/2017JE005357
      uncertainty: Saturated at maximum (Earth definition)
      excerpt: With annual-mean temperature ~200 K and nightly minima ~150-185 K, Tmin < 0 degC every sol, so every day is
        a frost day under the Earth definition.
    dust_aod_mean:
      value: 0.5
      unit: unitless (visible column optical depth)
      method: proxy
      source: Analogy to Jezero MEDA/Mastcam-Z (Rodriguez-Manfredi et al. 2023, Nature Geoscience 16, 19 (MEDA, first 250
        sols; text read from Research Square preprint))
      doi: 10.1038/s41561-022-01084-0
      uncertainty: +/-0.25
      excerpt: No site-specific record exists, so this is set equal to the Jezero central value. Replace it with the Montabone
        et al. multi-year dust climatology (gridded column dust optical depth) sampled at AP-1.
    ws10m_m_s:
      value: 7.9
      unit: m/s
      method: proxy
      source: Viudez-Moreiras et al. 2022, JGR Planets 127, e2022JE007523 (Winds at the Mars 2020 landing site 2) (InSight
        Elysium Planitia Weibull fit used as plains analog)
      doi: 10.1029/2022JE007523
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10078282/
      uncertainty: +/-3 m/s
      excerpt: No Arcadia wind data exist. Viudez-Moreiras et al. fit InSight Elysium Planitia winds with Weibull c = 6.20
        m/s, k = 1.92 (mean ~5.5 m/s near 1.2 m). That is used as a smooth northern-plains analog, scaled to 10 m with a log
        profile, z0 = 0.01 m (x1.44).
      measured_value_analog: 5.5
      measured_height_m: 1.2
    precip_mm_day:
      value: 0
      unit: mm/day
      method: literature
      source: Physical basis (no liquid precipitation at present-day Mars surface pressure/temperature; only trace H2O/CO2
        ice deposition)
      uncertainty: 0
      excerpt: No rainfall occurs; set to 0 by definition. The Earth layer is liquid-equivalent precipitation, so the target
        sits at the dry extreme.
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html
    aridity_index:
      value: 0
      unit: unitless (P/PET)
      method: literature
      source: 'Physical basis: P = 0 so P/PET = 0'
      uncertainty: 0
      excerpt: With zero precipitation the UNEP-style aridity index is 0 (hyper-arid end-member).
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html
    barren_pct:
      value: 100
      unit: '%'
      method: literature
      source: 'Physical basis: no vegetation on the Mars'
      uncertainty: 0
      excerpt: No plant cover; the whole surface is bare regolith/rock, matching the Earth 'barren' land-cover class.
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html
    forest_pct:
      value: 0
      unit: '%'
      method: literature
      source: 'Physical basis: no vegetation'
      uncertainty: 0
      excerpt: No forest cover exists; set to 0.
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html
    slope_median_deg:
      value: null
      unit: deg
      method: computed
      source: SolMate DEM pipeline (to be computed from LOLA/MOLA/HRSC/HiRISE DEMs)
      uncertainty: null
      excerpt: Left null on purpose; filled by the terrain stage from DEMs.
    slope_p90_proxy_deg:
      value: null
      unit: deg
      method: computed
      source: SolMate DEM pipeline (to be computed from LOLA/MOLA/HRSC/HiRISE DEMs)
      uncertainty: null
      excerpt: Left null on purpose; filled by the terrain stage from DEMs.
    elev_std_m:
      value: null
      unit: m
      method: computed
      source: SolMate DEM pipeline (to be computed from LOLA/MOLA/HRSC/HiRISE DEMs)
      uncertainty: null
      excerpt: Left null on purpose; filled by the terrain stage from DEMs.
    t2m_coldest_month_c:
      value: -100
      unit: degC
      method: proxy
      source: Bramson et al. 2017, JGR Planets 122, 2250-2266 (preservation of midlatitude ice sheets; TES albedo/TI for Arcadia)
      doi: 10.1002/2017JE005357
      uncertainty: +/-20 degC (modelled, no in-situ record)
      excerpt: Winter at ~40 N on Mars brings surface temperatures near the CO2 frost point (~150 K); the coldest seasonal
        mean near-surface temperature is estimated at about 173 K.
  breaks_down:
    gravity_m_s2:
      value: 3.73
      unit: m/s^2
      method: literature
      source: NASA NSSDCA Mars Fact Sheet
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html
      uncertainty: ~0.02 with latitude
      excerpt: NASA lists Mars mean surface gravity as 3.73 m/s^2.
    surface_pressure_hpa:
      value: 7.9
      unit: hPa
      method: proxy
      source: Sanchez-Lavega et al. 2023, JGR Planets 128, e2022JE007480 (MEDA pressure, sols 15-460); NASA NSSDCA Mars Fact
        Sheet
      doi: 10.1029/2022JE007480
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html
      uncertainty: +/-1 hPa plus seasonal +/-~10%
      excerpt: 'Estimate: Jezero''s (-2.6 km) MEDA mean of ~7.0 hPa scaled to AP-1 (-3.9 km) with a ~11 km scale height (x1.12).
        NASA''s global mean is 6.36 mb at the datum, ranging 4.0-8.7 mb.'
    radiation_dose_msv_day:
      value: 0.64
      unit: mSv/day
      method: literature
      source: Hassler et al. 2014, Science 343, 1244797 (MSL RAD, Gale crater surface)
      doi: 10.1126/science.1244797
      url: https://www.swsc-journal.org/articles/swsc/full_html/2016/01/swsc150074/swsc150074.html
      uncertainty: +/-0.12 mSv/day; Gale (-4.5 km) elevation similar to AP-1 (-3.9 km)
      excerpt: MSL RAD measured 0.64 +/- 0.12 mSv/day dose equivalent at Gale crater. AP-1 sits at a similar low elevation,
        so atmospheric shielding is comparable.
