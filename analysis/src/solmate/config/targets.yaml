      method: computed
      source: SolMate DEM pipeline (to be computed from LOLA/MOLA/HRSC/HiRISE DEMs)
      uncertainty: null
      excerpt: Left null on purpose; filled by the terrain stage from DEMs.
    t2m_coldest_month_c:
      value: -123
      unit: degC
      method: proxy
      source: 'Diviner-based seasonal average temperatures: Bourque & Thomson 2024, LPSC 55 abstract 2493 (Malapert Massif,
        Diviner via QuickMap); Flahaut et al. 2020, Planet. Space Sci. 180, 104750 (south pole ROIs, Diviner site averages)'
      doi: 10.1016/j.pss.2019.104750
      url: https://www.hou.usra.edu/meetings/lpsc2024/pdf/2493.pdf
