      source: 'Physical basis: no vegetation'
      uncertainty: 0
      excerpt: No forest cover exists; set to 0.
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html
    slope_median_deg:
      value: null
      unit: deg
      method: computed
      source: SolMate DEM pipeline (to be computed from LOLA/MOLA/HRSC/HiRISE DEMs)
      uncertainty: null
