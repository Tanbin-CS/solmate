        relative humidity is undefined and set to 0.
    albedo_wsa_sw:
      value: 0.24
      unit: unitless (broadband, white-sky)
      method: proxy
      source: Vasavada et al. 2012, JGR Planets 117 (Diviner equatorial temps, albedo model)
      doi: 10.1029/2011JE003987
      url: http://luna1.diviner.ucla.edu/~dap/pubs/057.pdf
      uncertainty: 0.20-0.24 (A0 = 0.12-0.16). LOLA 1064 nm normal albedo is a different quantity (~0.36-0.37 in cold polar
        terrain; Fisher et al. 2017, doi 10.1016/j.icarus.2017.03.023)
      excerpt: Vasavada et al. give Diviner highland normal albedo A0 ~0.16 and A(i) = A0 + 0.045(i/45)^3 + 0.14(i/90)^8.
        Integrating over incidence (white-sky, like MODIS WSA) gives ~0.24 for A0 = 0.16 (0.20 for A0 = 0.12). Polar sunlight
        arrives at ~85 deg incidence, where directional albedo is ~0.5.
      derivation: WSA = integral_0^90 A(i) 2 cos(i) sin(i) di, computed by the SolMate research agent
    mineral_class:
      mafic: false
      carbonate: false
      quartz_rich: false
      dominant: feldspathic highlands (plagioclase-rich, anorthositic) with a minor pyroxene (noritic) component
      method: literature
      source: Moriarty & Petro 2024, JGR Planets 129, e2023JE008266 (south polar mineralogy, Artemis exploration zone)
      doi: 10.1029/2023JE008266
      uncertainty: Region-scale; the mafic signal is strongest near the de Gerlache-Kocher Massif (not in this target list)
      excerpt: Moon Mineralogy Mapper data show a detectable pyroxene signature in the south polar region, tied to South Pole-Aitken
        ejecta, on a plagioclase-dominated crust. No quartz or carbonate is reported. Earth ASTER indices are not transferable,
        so booleans only.
    snow_months_per_year:
      value: 12
      unit: months
      method: proxy
      source: Wueller et al. 2026, JGR Planets 131, e2025JE009434 (Appendix A candidate landing sites)
      doi: 10.1029/2025JE009434
      uncertainty: Scheme value; 0/6/12 classes
      excerpt: At least one candidate site has a PSR that stays <110 K all year within a 2 km walk (Wueller et al. 2026).
        That is a perennial cold trap where surface/near-surface water ice is thermally stable, mapped to 12 'ice months'.
      psr_access_class: lt110
    frost_days_per_year:
      value: 365
      unit: days
      method: proxy
      source: 'Earth definition (days with Tmin < 0 degC) applied to Diviner polar temperatures: Williams et al. 2019, JGR
        Planets 124, 2505-2521 (Diviner seasonal polar temperatures)'
      doi: 10.1029/2019JE006028
      uncertainty: Saturated at maximum; no Earth place can exceed it
      excerpt: Surface minima at the south polar landing regions are far below 273 K every day of the year, so every day counts
        as a frost day. PSRs inside the regions never exceed ~110-125 K.
    precip_mm_day:
      value: 0
      unit: mm/day
      method: literature
      source: Physical basis (no atmosphere (surface-bounded exosphere only))
      uncertainty: 0
      excerpt: No rainfall occurs; set to 0 by definition. The Earth layer is liquid-equivalent precipitation, so the target
        sits at the dry extreme.
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html
    aridity_index:
      value: 0
      unit: unitless (P/PET)
      method: literature
      source: 'Physical basis: P = 0 so P/PET = 0'
      uncertainty: 0
      excerpt: With zero precipitation the UNEP-style aridity index is 0 (hyper-arid end-member).
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html
    barren_pct:
      value: 100
      unit: '%'
      method: literature
      source: 'Physical basis: no vegetation on the Moon'
      uncertainty: 0
      excerpt: No plant cover; the whole surface is bare regolith/rock, matching the Earth 'barren' land-cover class.
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html
    forest_pct:
      value: 0
      unit: '%'
      method: literature
      source: 'Physical basis: no vegetation'
      uncertainty: 0
      excerpt: No forest cover exists; set to 0.
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html
    slope_median_deg:
      value: null
      unit: deg
      method: computed
      source: SolMate DEM pipeline (to be computed from LOLA/MOLA/HRSC/HiRISE DEMs)
      uncertainty: null
      excerpt: Left null on purpose; filled by the terrain stage from DEMs.
    slope_p90_proxy_deg:
      value: null
      unit: deg
      method: computed
      source: SolMate DEM pipeline (to be computed from LOLA/MOLA/HRSC/HiRISE DEMs)
      uncertainty: null
      excerpt: Left null on purpose; filled by the terrain stage from DEMs.
    elev_std_m:
      value: null
      unit: m
      method: computed
      source: SolMate DEM pipeline (to be computed from LOLA/MOLA/HRSC/HiRISE DEMs)
      uncertainty: null
      excerpt: Left null on purpose; filled by the terrain stage from DEMs.
    t2m_coldest_month_c:
      value: -123
      unit: degC
      method: proxy
      source: 'Diviner-based seasonal average temperatures: Bourque & Thomson 2024, LPSC 55 abstract 2493 (Malapert Massif,
        Diviner via QuickMap); Flahaut et al. 2020, Planet. Space Sci. 180, 104750 (south pole ROIs, Diviner site averages)'
      doi: 10.1016/j.pss.2019.104750
      url: https://www.hou.usra.edu/meetings/lpsc2024/pdf/2493.pdf
      uncertainty: +/-40 K (mean surface T ~110-190 K, i.e. -163 to -83 degC)
      excerpt: The Moon's 1.5 degree axial tilt gives no meaningful seasons at the landing areas, so the coldest-month mean
        equals the annual mean surface temperature from the same Diviner-based estimate.
      value_k: 150
      applies_to: illuminated landing area (not PSR)
  breaks_down:
    gravity_m_s2:
      value: 1.62
      unit: m/s^2
      method: literature
      source: NASA NSSDCA Moon Fact Sheet
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html
      uncertainty: ~0.01 (latitude/topography variation is small)
      excerpt: NASA lists lunar surface gravity as 1.62 m/s^2, 0.165 of Earth's.
    surface_pressure_hpa:
      value: 3.0e-12
      unit: hPa
      method: literature
      source: NASA NSSDCA Moon Fact Sheet
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html
      uncertainty: order of magnitude; the daytime exosphere is denser
      excerpt: 'The fact sheet gives a night-time surface pressure of 3e-15 bar (= 3e-12 hPa): effectively vacuum.'
    radiation_dose_msv_day:
      value: 1.369
      unit: mSv/day
      method: literature
      source: Zhang et al. 2020, Science Advances 6, eaaz1334 (Chang'e-4 LND, first lunar surface dose)
      doi: 10.1126/sciadv.aaz1334
      uncertainty: +/-0.069 mSv/day (paper); varies with the solar cycle
      excerpt: Chang'e-4's LND measured an average dose equivalent of 1369 uSv/day on the far side (Von Karman crater, ~45.5
        S) near solar minimum in 2019, ~2.6x the ISS GCR dose. No polar surface measurement exists, but with no atmosphere
        or global field the value should carry over to the pole.
      agency: CNSA (non-NASA extra; breaks-down context only, never scored)
- id: jezero_crater
  name: Jezero Crater
  body: mars
  group: mars_2020_landing_site
  centroid:
    lat: 18.4446
    lon: 77.4509
    frame: planetocentric, east-positive
    approximate: false
    method: Mars 2020 landing site coordinates as specified by SolMate (consistent with 18.44 N, 77.45 E in Sanchez-Lavega
      et al. 2023)
    source: Sanchez-Lavega et al. 2023, JGR Planets 128, e2022JE007480 (MEDA pressure, sols 15-460)
    doi: 10.1029/2022JE007480
    excerpt: Perseverance landed in Jezero crater at 77.45 E, 18.44 N (Octavia E. Butler landing site). Martinez et al. 2023
      quote 77.5945 E, 18.3628 N, -2656 m.
  indicators:
    lst_diurnal_range_k:
      value: 90
      unit: K
      method: literature
      source: Munguira et al. 2023, JGR Planets 128, e2022JE007559 (MEDA near-surface temperatures, table of diurnal stats)
      doi: 10.1029/2022JE007559
      url: https://addi.ehu.es/bitstream/handle/10810/61121/JGR%20Planets%20-%202023%20-%20Munguira%20-%20Near%20Surface%20Atmospheric%20Temperatures%20at%20Jezero%20From%20Mars%202020%20MEDA%20Measurements.pdf
      uncertainty: +/-15 K; 56-104 K depending on terrain thermal inertia and season
      excerpt: MEDA TIRS ground temperature ranged 86 K a day at Ls 90 (277/191 K) and 104 K at Ls 180 (293/189 K) in Munguira
        et al.'s table. Martinez et al. 2023 report 56-87 K swings across terrains with TI 525 vs 230 SI.
    lst_night_min_k:
      value: 190
      unit: K
      method: literature
      source: Munguira et al. 2023, JGR Planets 128, e2022JE007559 (MEDA near-surface temperatures, table of diurnal stats)
      doi: 10.1029/2022JE007559
      url: https://addi.ehu.es/bitstream/handle/10810/61121/JGR%20Planets%20-%202023%20-%20Munguira%20-%20Near%20Surface%20Atmospheric%20Temperatures%20at%20Jezero%20From%20Mars%202020%20MEDA%20Measurements.pdf
      uncertainty: +/-5 K (Ls 25-180); colder nights <185 K occur in some seasons (Zorzano et al. 2024, doi 10.1038/s41598-024-57458-4)
      excerpt: MEDA ground minima were 191 K (Ls 90) and 189 K (Ls 180) at ~05:00-05:30 LTST. Zorzano et al. 2024 note night
        ground temperatures below 190 K, with transient frost possible below ~185 K.
    t2m_mean_c:
      value: -53
      unit: degC
      method: literature
      source: Munguira et al. 2023, JGR Planets 128, e2022JE007559 (MEDA near-surface temperatures, table of diurnal stats)
      doi: 10.1029/2022JE007559
      url: https://addi.ehu.es/bitstream/handle/10810/61121/JGR%20Planets%20-%202023%20-%20Munguira%20-%20Near%20Surface%20Atmospheric%20Temperatures%20at%20Jezero%20From%20Mars%202020%20MEDA%20Measurements.pdf
      uncertainty: +/-5 degC; data cover Ls 25-180 of MY36 only
      excerpt: MEDA air temperature at 1.45 m averaged 216 K (Ls 25), 219 K (Ls 90) and 224 K (Ls 180), so ~220 K = -53 degC.
        Ground means were 227-230 K (~ -45 degC).
      value_k: 220
      height_m: 1.45
    rh2m_pct:
      value: 5
      unit: '%'
      method: proxy
      source: Rodriguez-Manfredi et al. 2023, Nature Geoscience 16, 19 (MEDA, first 250 sols; text read from Research Square
        preprint)
      doi: 10.1038/s41561-022-01084-0
      url: https://www.researchsquare.com/article/rs-1634885/latest.pdf
      uncertainty: diurnal range ~0-30%; daytime <=2%
      excerpt: MEDA HS daily-maximum RH is typically 15-30% (relative to sensor temperature, early morning) and daytime RH
        is at or below the ~2% uncertainty (Zorzano et al. 2024). The 5% diurnal mean is our estimate from that shape, not
        a published number.
      height_m: 1.5
    albedo_wsa_sw:
      value: 0.147
      unit: unitless (TES bolometric Lambert albedo)
      method: literature
      source: Martinez et al. 2023, JGR Planets 128, e2022JE007537 (MEDA surface energy budget, albedo, thermal inertia)
      doi: 10.1029/2022JE007537
      uncertainty: MEDA local values 0.10-0.18; traverse average 0.14
      excerpt: Martinez et al. compare MEDA broadband albedo (avg 0.14 along the traverse) with the collocated TES bolometric
        albedo of 0.147 and find very good agreement.
    mineral_class:
      mafic: true
      carbonate: true
      quartz_rich: false
      dominant: olivine- and pyroxene-bearing igneous floor units with Mg-rich carbonates (olivine-carbonate unit; delta/margin
        carbonates)
      method: literature
      source: Horgan et al. 2020, Icarus 339, 113526 (mineral diversity of Jezero crater, CRISM)
      doi: 10.1016/j.icarus.2019.113526
      also: Olivine-carbonate mineralogy of the Jezero crater region, https://pmc.ncbi.nlm.nih.gov/articles/PMC7592698/
      uncertainty: Hydrated silica is reported locally from orbit; no quartz-rich unit
      excerpt: CRISM maps of Jezero show olivine and olivine+carbonate assemblages on the floor and delta, read by Horgan
        et al. as possible lacustrine carbonates. Perseverance later confirmed olivine- and pyroxene-rich igneous rocks on
        the floor.
    snow_months_per_year:
      value: 0
      unit: months
      method: proxy
      source: Zorzano et al. 2024, Scientific Reports 14, 7175 (thermal and water-activity environment of the MSR collection)
      doi: 10.1038/s41598-024-57458-4
      uncertainty: 0-0.5
      excerpt: Jezero has no lasting surface ice. MEDA shows the surface can reach ice saturation and frost can be transiently
        stable for a few hours on some nights when ground T < ~185 K, so persistent snow/ice cover is 0.
    frost_days_per_year:
      value: 365
      unit: days
      method: proxy
      source: Munguira et al. 2023, JGR Planets 128, e2022JE007559 (MEDA near-surface temperatures, table of diurnal stats);
        Zorzano et al. 2024, Scientific Reports 14, 7175 (thermal and water-activity environment of the MSR collection)
      doi: 10.1029/2022JE007559
      uncertainty: Saturated at maximum (Earth definition)
      excerpt: Under the Earth definition (Tmin < 0 degC) every day is a frost day, since MEDA ground minima are ~185-191
        K every sol. Water frost actually forms only on a subset of nights.
    dust_aod_mean:
      value: 0.5
      unit: unitless (visible column optical depth)
      method: proxy
      source: Rodriguez-Manfredi et al. 2023, Nature Geoscience 16, 19 (MEDA, first 250 sols; text read from Research Square
        preprint)
      doi: 10.1038/s41561-022-01084-0
      url: https://www.researchsquare.com/article/rs-1634885/latest.pdf
      uncertainty: +/-0.2; aphelion 0.3-0.6, regional dust storms >1
      excerpt: During the first 250 sols (aphelion season) OD was ~0.5 in the morning and ~0.4 in the afternoon, with low-dust-season
        OD of 0.3-0.6. The dusty season (high-opacity epoch Ls ~130-360 per Sanchez-Lavega et al.) runs higher, so 0.5 is
        a central estimate. The Mastcam-Z record (Lemmon et al., Mendeley doi 10.17632/gktjp9jptb.1) can give a computed annual
        mean.
    ws10m_m_s:
      value: 4.4
      unit: m/s
      method: proxy
      source: Viudez-Moreiras et al. 2022, JGR Planets 127, e2022JE007523 (Winds at the Mars 2020 landing site 2)
      doi: 10.1029/2022JE007523
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10078282/
      uncertainty: +/-3 m/s; measured 3.2 +/- 2.3 m/s at 1.5 m
      excerpt: MEDA mean wind was 3.2 +/- 2.3 m/s at 1.5 m in northern spring-summer (Weibull c = 3.57 m/s, k = 1.49), the
        calmest of the instrumented sites. Scaled to 10 m with a neutral log profile, z0 = 0.01 m (x1.38).
      measured_value: 3.2
      measured_height_m: 1.5
    precip_mm_day:
      value: 0
      unit: mm/day
      method: literature
      source: Physical basis (no liquid precipitation at present-day Mars surface pressure/temperature; only trace H2O/CO2
        ice deposition)
      uncertainty: 0
      excerpt: No rainfall occurs; set to 0 by definition. The Earth layer is liquid-equivalent precipitation, so the target
        sits at the dry extreme.
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html
    aridity_index:
      value: 0
      unit: unitless (P/PET)
      method: literature
      source: 'Physical basis: P = 0 so P/PET = 0'
      uncertainty: 0
      excerpt: With zero precipitation the UNEP-style aridity index is 0 (hyper-arid end-member).
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html
    barren_pct:
      value: 100
      unit: '%'
      method: literature
      source: 'Physical basis: no vegetation on the Mars'
      uncertainty: 0
      excerpt: No plant cover; the whole surface is bare regolith/rock, matching the Earth 'barren' land-cover class.
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html
    forest_pct:
      value: 0
      unit: '%'
