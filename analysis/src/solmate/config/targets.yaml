      doi: 10.1029/2019JE006028
      url: https://www.hou.usra.edu/meetings/lpsc2024/pdf/2493.pdf
      uncertainty: +/-30 K (40-100 K); adjacent PSRs reach ~25-40 K
      excerpt: Estimate of the typical annual minimum of the illuminated landing surface when shadowed (winter). At Malapert
        the lowest Diviner seasonal-AVERAGE values in the sunlit quadrants are ~46-124 K, so minima are lower still; PSR floors
        near the pole reach ~25-40 K.
      applies_to: illuminated landing area (not PSR)
    t2m_mean_c:
      value: -123
      unit: degC
      method: proxy
      source: 'Diviner-based seasonal average temperatures: Bourque & Thomson 2024, LPSC 55 abstract 2493 (Malapert Massif,
        Diviner via QuickMap); Flahaut et al. 2020, Planet. Space Sci. 180, 104750 (south pole ROIs, Diviner site averages)'
      doi: 10.1016/j.pss.2019.104750
      url: https://www.hou.usra.edu/meetings/lpsc2024/pdf/2493.pdf
      uncertainty: +/-40 K (mean surface T ~110-190 K, i.e. -163 to -83 degC)
      excerpt: Mean surface (not air) temperature of ~150 K for the sunlit landing area. Malapert's sunlit quadrants have
        Diviner seasonal averages up to ~171-193 K, while Flahaut et al. report site-averaged Diviner means of ~83-98 K for
        ROIs that include PSR-adjacent ground.
      value_k: 150
      applies_to: illuminated landing area (not PSR)
    rh2m_pct:
      value: 0
      unit: '%'
      method: literature
      source: 'Physical basis: no atmosphere. NASA NSSDCA Moon Fact Sheet'
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html
      uncertainty: 0
      excerpt: The Moon has only a collisionless exosphere (night surface pressure ~3e-15 bar per the NASA fact sheet), so
        relative humidity is undefined and set to 0.
    albedo_wsa_sw:
      value: 0.24
      unit: unitless (broadband, white-sky)
      method: proxy
      source: Vasavada et al. 2012, JGR Planets 117 (Diviner equatorial temps, albedo model)
      doi: 10.1029/2011JE003987
      url: http://luna1.diviner.ucla.edu/~dap/pubs/057.pdf
      uncertainty: 0.20-0.24 (A0 = 0.12-0.16). LOLA 1064 nm normal albedo is a different quantity (~0.36-0.37 in cold polar
        terrain; Fisher et al. 2017, doi 10.1016/j.icarus.2017.03.023)
      excerpt: Vasavada et al. give Diviner highland normal albedo A0 ~0.16 and A(i) = A0 + 0.045(i/45)^3 + 0.14(i/90)^8.
        Integrating over incidence (white-sky, like MODIS WSA) gives ~0.24 for A0 = 0.16 (0.20 for A0 = 0.12). Polar sunlight
        arrives at ~85 deg incidence, where directional albedo is ~0.5.
      derivation: WSA = integral_0^90 A(i) 2 cos(i) sin(i) di, computed by the SolMate research agent
    mineral_class:
      mafic: false
      carbonate: false
      quartz_rich: false
      dominant: feldspathic highlands (plagioclase-rich, anorthositic) with a minor pyroxene (noritic) component
      method: literature
      source: Moriarty & Petro 2024, JGR Planets 129, e2023JE008266 (south polar mineralogy, Artemis exploration zone)
      doi: 10.1029/2023JE008266
      uncertainty: Region-scale; the mafic signal is strongest near the de Gerlache-Kocher Massif (not in this target list)
      excerpt: Moon Mineralogy Mapper data show a detectable pyroxene signature in the south polar region, tied to South Pole-Aitken
        ejecta, on a plagioclase-dominated crust. No quartz or carbonate is reported. Earth ASTER indices are not transferable,
        so booleans only.
    snow_months_per_year:
      value: 12
      unit: months
      method: proxy
      source: Wueller et al. 2026, JGR Planets 131, e2025JE009434 (Appendix A candidate landing sites)
      doi: 10.1029/2025JE009434
      uncertainty: Scheme value; 0/6/12 classes
      excerpt: At least one candidate site has a PSR that stays <110 K all year within a 2 km walk (Wueller et al. 2026).
        That is a perennial cold trap where surface/near-surface water ice is thermally stable, mapped to 12 'ice months'.
      psr_access_class: lt110
    frost_days_per_year:
      value: 365
      unit: days
      method: proxy
      source: 'Earth definition (days with Tmin < 0 degC) applied to Diviner polar temperatures: Williams et al. 2019, JGR
        Planets 124, 2505-2521 (Diviner seasonal polar temperatures)'
      doi: 10.1029/2019JE006028
      uncertainty: Saturated at maximum; no Earth place can exceed it
      excerpt: Surface minima at the south polar landing regions are far below 273 K every day of the year, so every day counts
        as a frost day. PSRs inside the regions never exceed ~110-125 K.
    precip_mm_day:
      value: 0
      unit: mm/day
      method: literature
      source: Physical basis (no atmosphere (surface-bounded exosphere only))
      uncertainty: 0
      excerpt: No rainfall occurs; set to 0 by definition. The Earth layer is liquid-equivalent precipitation, so the target
        sits at the dry extreme.
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html
    aridity_index:
      value: 0
      unit: unitless (P/PET)
      method: literature
      source: 'Physical basis: P = 0 so P/PET = 0'
      uncertainty: 0
      excerpt: With zero precipitation the UNEP-style aridity index is 0 (hyper-arid end-member).
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html
    barren_pct:
      value: 100
      unit: '%'
      method: literature
      source: 'Physical basis: no vegetation on the Moon'
      uncertainty: 0
      excerpt: No plant cover; the whole surface is bare regolith/rock, matching the Earth 'barren' land-cover class.
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html
    forest_pct:
      value: 0
      unit: '%'
      method: literature
      source: 'Physical basis: no vegetation'
      uncertainty: 0
      excerpt: No forest cover exists; set to 0.
      url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html
